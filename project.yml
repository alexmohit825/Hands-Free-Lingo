name: HandsFreeLingo
options:
  bundleIdPrefix: com.Alex
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: HandsFreeLingo
    PRODUCT_BUNDLE_IDENTIFIER: com.Alex.VocalLingo
    DEVELOPMENT_TEAM: "523MJL63MC"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: "4"
    MARKETING_VERSION: "1.1.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    INFOPLIST_FILE: Info.plist
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_ENTITLEMENTS: VocalLingo.entitlements
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  HandsFreeLingo:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "**/.git"
          - "**/.github"
          - "SETUP.md"
          - "project.yml"
          - "ExportOptions.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Alex.VocalLingo
        PRODUCT_NAME: HandsFreeLingo
        INFOPLIST_FILE: Info.plist
