name: Hands-Free Lingo TestFlight & App Store Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deliver:
    name: 🍏 Compile, Archive & Deliver to App Store Connect
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Select Xcode 26.x (iOS 26+ SDK)
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s /Applications/Xcode_26.3.0.app || sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: ⚙️ Install XcodeGen
        run: brew install xcodegen

      - name: 🏗️ Generate Native Xcode Project
        run: xcodegen generate

      - name: 🔑 Configure App Store Connect API Credentials
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8

      - name: 🧪 Validate Apple API Key Connection
        run: |
          xcrun altool --list-apps \
            --apiKey 38F6WA87DU \
            --apiIssuer 73c7355a-beef-4d79-919d-c3d7dec7747a

      - name: 🚀 Archive Release Candidate for App Store
        run: |
          mkdir -p build/archive
          xcodebuild archive \
            -project HandsFreeLingo.xcodeproj \
            -scheme HandsFreeLingo \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/archive/HandsFreeLingo.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: 📤 Export & Deliver to App Store Connect via Apple Direct Upload
        run: |
          mkdir -p build/output
          xcodebuild -exportArchive \
            -archivePath build/archive/HandsFreeLingo.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/output \
            -allowProvisioningUpdates \
            -authenticationKeyID 38F6WA87DU \
            -authenticationKeyIssuerID 73c7355a-beef-4d79-919d-c3d7dec7747a \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8
          echo "✓ Native xcodebuild direct upload completed!"
